{% extends 'base.html' %} {% load socialaccount %} 

{% block title %} Contact - Get in Touch {% endblock %} 
{% block content %}
<div class="side-margin d-flex flex-col align-center py-1 listing-form-container">
    <h2>Contact</h2>
    <form class="create-form d-flex justify-center flex-col" method="post">
        {% csrf_token %}
        <div class="form-group d-flex flex-col py-1">
            <label for="id_name">Your Name:</label>
            <input class="form-input p-1 mt-1" placeholder="your name" type="text" name="name" maxlength="100" required="" id="id_name">
        </div>
        <div class="form-group d-flex flex-col py-1">
            <label for="id_subject">Subject:</label>
            <input class="form-input p-1 mt-1" placeholder="subject" type="text" name="subject" maxlength="100" required="" id="id_subject">
        </div>
        <div class="form-group d-flex flex-col py-1">
            <label for="id_email">Your Email:</label>
            <input class="form-input p-1 mt-1" placeholder="your email" type="email" name="email" maxlength="320" required="" id="id_email">
        </div>
        <div class="form-group d-flex flex-col py-1">
            <label for="id_message">Message:</label>
            <textarea class="form-input p-1 mt-1" name="message" cols="40" rows="10" required="" id="id_message"></textarea>
        </div>
        <button class="btn btn-primary fw-bold" type="submit">Send Message</button>
    </form>
</div>
{% endblock %}
